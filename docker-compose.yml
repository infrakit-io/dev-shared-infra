services:
  # Traefik — reverse proxy for local dev apps.
  # Apps attach to the `dev-shared` network and declare routing via
  # docker labels (traefik.http.routers.<name>.rule=Host(`...`)).
  #
  # `always`, not `unless-stopped`, on both services below: Docker Desktop
  # gracefully stops running containers on its way down, which sets the
  # engine's HasBeenManuallyStopped flag; on the next daemon start
  # `unless-stopped` then refuses to restart. Observed exactly that — both
  # containers left Exited(0)/Exited(137) after an unattended Docker Desktop
  # restart, with nobody running `task down`, so every app behind the tunnel
  # served Cloudflare Error 1033. `always` ignores that flag. `task down`
  # still keeps things down: it REMOVES the containers, and a removed
  # container has no restart policy left to honour.
  traefik:
    image: traefik:v3.7
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      # Dashboard (optional, dev-only): http://localhost:8090/dashboard/
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dev-shared

  # Cloudflare tunnel — pulls config from CF Dashboard via the token.
  # The tunnel's wildcard ingress (e.g. `*.dev.example.com` -> http://traefik:80)
  # is configured in the Cloudflare Zero Trust Dashboard for the tunnel that
  # owns this token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - traefik
    networks:
      - dev-shared

networks:
  dev-shared:
    name: dev-shared
    # NOT external — this compose creates the network on first `up`.
    # Other app composes reference it as `external: true` with `name: dev-shared`.
